name: the_we_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  dio: ^5.9.2
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  table_calendar: ^3.2.0
  intl: ^0.20.2
  file_selector: ^1.1.0
  file_saver: ^0.4.0
  pdfrx: ^2.4.7
  pdf: ^3.11.3
  flutter_secure_storage: ^11.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/SUIT-Medium.ttf
    - assets/fonts/SUIT-Bold.ttf
  fonts:
    - family: SUIT-Variable
      fonts:
        - asset: assets/fonts/SUIT-Variable.ttf
          weight: 400
        - asset: assets/fonts/SUIT-Variable.ttf
          weight: 600
        - asset: assets/fonts/SUIT-Variable.ttf
          weight: 700
