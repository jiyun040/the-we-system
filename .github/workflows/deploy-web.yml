name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release \
            --base-href=/ \
            --dart-define=API_BASE_URL=https://the-we-erp.cloud/api/v1

      - name: Upload web build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: build/web/*
          target: /tmp/the-we-web
          strip_components: 2

      - name: Activate deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /var/www/the-we-erp
            sudo rm -rf /var/www/the-we-erp/*
            sudo cp -r /tmp/the-we-web/* /var/www/the-we-erp/
            sudo chown -R www-data:www-data /var/www/the-we-erp
            sudo nginx -t
            sudo systemctl reload nginx
            rm -rf /tmp/the-we-web
