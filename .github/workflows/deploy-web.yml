name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release \
            --base-href=/ \
            --dart-define=API_BASE_URL=https://the-we-erp.cloud/api/v1

      - name: Activate deployment
        run: |
          set -e
          sudo mkdir -p /var/www/the-we-erp
          sudo rm -rf /var/www/the-we-erp/*
          sudo cp -r build/web/. /var/www/the-we-erp/
          sudo chown -R www-data:www-data /var/www/the-we-erp
          sudo nginx -t
          sudo systemctl reload nginx
