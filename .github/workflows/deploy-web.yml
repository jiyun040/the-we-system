name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release \
            --base-href=/ \
            --dart-define=API_BASE_URL=https://the-we-erp.cloud/api/v1

      - name: Activate deployment
        run: |
          set -e
          sudo mkdir -p /var/www/the-we-erp
          sudo rm -rf /var/www/the-we-erp/*
          sudo cp -r build/web/. /var/www/the-we-erp/
          sudo chown -R www-data:www-data /var/www/the-we-erp
          # The API and the Flutter SPA share this domain. Keep the SPA as
          # Nginx's root so / does not expose Django's health JSON response.
          sudo cp deploy/nginx/the-we-erp.conf /etc/nginx/sites-available/the-we-erp
          # The Ubuntu package enables this catch-all site by default. It can
          # declare the same default listener as an older deployment config,
          # which makes nginx -t fail before reload.
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sfn /etc/nginx/sites-available/the-we-erp /etc/nginx/sites-enabled/the-we-erp
          sudo nginx -t
          sudo systemctl reload nginx
