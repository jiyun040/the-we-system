server {
    # Keep the distribution's default server intact. Declaring this site as
    # another default causes nginx -t to fail when sites-enabled/default is
    # present on the deployment host.
    listen 80;
    listen [::]:80;
    server_name the-we-erp.cloud www.the-we-erp.cloud;

    root /var/www/the-we-erp;
    index index.html;
    client_max_body_size 20m;

    location /static/ {
        alias /home/ubuntu/the-we-system-server/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/the-we-system-server/media/;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    # Flutter Web is a single page app. Let the browser routes resolve to
    # index.html while API requests continue to reach Django above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
